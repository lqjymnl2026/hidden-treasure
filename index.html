<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐藏的珍宝｜圣经互动学习平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 660px;
        }
        .treasure {
            font-size: 83px;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px #ffd700); }
            50% { filter: drop-shadow(0 0 40px #ffd700) brightness(1.2); }
        }
        h1 {
            font-size: 45px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffd700, #ffA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 21px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 17px;
            opacity: 0.55;
            margin-bottom: 38px;
            letter-spacing: 0.08em;
        }
        .btn-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .start-btn {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(135deg, #ffd700, #ffA500);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }
        .start-btn.ghost {
            background: transparent;
            color: #ffd700;
            border: 2px solid rgba(255, 215, 0, 0.6);
            box-shadow: none;
            font-size: 20px;
            padding: 16px 32px;
        }
        .start-btn.ghost:hover {
            background: rgba(255, 215, 0, 0.12);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.15);
        }
        .verse {
            margin-top: 44px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            font-style: italic;
        }
        .verse p {
            font-size: 19px;
            line-height: 1.6;
        }
        .verse cite {
            display: block;
            margin-top: 10px;
            opacity: 0.7;
        }
        @media (max-width: 480px) {
            h1 { font-size: 37px; }
            .treasure { font-size: 67px; }
            .start-btn { font-size: 19px; padding: 15px 28px; width: 100%; }
            .start-btn.ghost { font-size: 18px; padding: 13px 24px; }
        }
            .music-fab{position:fixed;right:16px;bottom:18px;z-index:99;width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,#ffd700,#ffA500);color:#1a1a2e;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .15s;}
        .music-fab:hover{transform:scale(1.08);}
        .music-fab.on{animation:fabPulse 2s ease-in-out infinite;}
        @keyframes fabPulse{0%,100%{box-shadow:0 8px 24px rgba(255,215,0,.35);}50%{box-shadow:0 8px 32px rgba(255,215,0,.7);}}
            .daily{display:none;margin-top:26px;padding:18px 22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.35);border-radius:15px;max-width:560px;margin-left:auto;margin-right:auto;}
        .daily-badge{display:inline-block;background:linear-gradient(135deg,#ffd700,#ffA500);color:#1a1a2e;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:10px;}
        .daily-text{font-family:"Songti SC",serif;font-size:17px;line-height:1.8;color:#f5e9c9;}
        .daily-ref{margin-top:6px;color:rgba(255,215,0,.9);font-size:14px;font-weight:700;}
    </style>
</head>
<body>
    <div class="container">
        <div class="treasure">💎</div>
        <h1>隐藏的珍宝</h1>
        <p class="subtitle">探索圣经知识，发现属灵珍宝</p>
        <p class="desc">📚 66卷圣经互动学习平台 · 主题 · 人物 · 进度</p>
        <div class="btn-row">
            <a href="platform.html" class="start-btn">📖 进入66卷互动查经</a>
            <a href="platform.html#/kids" class="start-btn ghost">🧒 儿童乐园</a>
            <a href="整本圣经知识问答闯关_手机版.html" class="start-btn ghost">🧠 开始闯关</a>
        </div>
        <div class="verse">
            <p>"宝贝藏在地里，人看见了，就藏起来，欢欢喜喜地去变卖一切所有的，买那块地。"</p>
            <cite>— 马太福音 13:44</cite>
        </div>
        <div class="daily" id="dailyVerseBox">
            <span class="daily-badge">💎 今日珍宝</span>
            <div class="daily-text" id="dailyText"></div>
            <div class="daily-ref" id="dailyRef"></div>
        </div>
    </div>
<audio id="bgMusic" src="music/light-ambient.wav" loop preload="auto" playsinline></audio>
<script src="js/data/verses.js"></script>
<script>
(function(){try{var v=dailyVerse();document.getElementById('dailyVerseBox').style.display='block';document.getElementById('dailyText').textContent='"'+v.text+'"';document.getElementById('dailyRef').textContent='—— '+v.ref;}catch(e){}})();
</script>
    <button class="music-fab" id="bgMusicBtn" onclick="toggleBgMusic()" title="背景轻音乐">🎵</button>
    <script>
    function toggleBgMusic(){var a=document.getElementById('bgMusic'),b=document.getElementById('bgMusicBtn');if(!a)return;if(a.paused){a.volume=.45;a.play().then(function(){b.classList.add('on');try{localStorage.setItem('yiqi-music','on');}catch(e){}}).catch(function(){alert('无法播放音乐');});}else{a.pause();b.classList.remove('on');try{localStorage.setItem('yiqi-music','off');}catch(e){}}}
    (function(){var a=document.getElementById('bgMusic'),b=document.getElementById('bgMusicBtn');if(!a||!b)return;var want=true;try{var v=localStorage.getItem('yiqi-music');want=v?v==='on':true;}catch(e){}
    if(!want)return;a.volume=.45;
    function tp(){a.play().then(function(){b.classList.add('on');try{localStorage.setItem('yiqi-music','on');}catch(e){}}).catch(function(){});}
    tp();
    ['pointerdown','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,function h(){tp();document.removeEventListener(ev,h);});});
    })();
    </script>
  </body>
</html>
