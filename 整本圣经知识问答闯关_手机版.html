<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>隐藏的珍宝知识问答闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --c1:#F7F0E6; --c2:#E9F1FB; --c3:#DCE9FA;
  --blue:#0078F0; --blue-d:#0048C0; --blue-l:#A8D8F0;
  --gold:#F2B93B; --coral:#F07070; --mint:#4FBF8F;
  --ink:#3A4A63; --brown:#604830; --line:#D7E3F4;
}
html,body{min-height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Heiti TC",sans-serif;
  background:linear-gradient(160deg,var(--c1),var(--c2) 45%,var(--c3));
  color:var(--ink);min-height:100vh;padding:12px 10px 60px;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:100%;margin:0 auto;padding:0 12px;}
.home-btn{display:inline-block;background:rgba(255,255,255,.95);border:3px solid var(--line);border-radius:14px;color:var(--blue-d);font-weight:900;font-size:clamp(14px,2.4vw,18px);padding:8px 22px;text-decoration:none;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,72,192,.12);}
.home-btn:hover{border-color:var(--blue);transform:translateY(-2px);}
.top{text-align:center;padding:20px 0 8px;}
.title{font-size:clamp(30px,6vw,64px);font-weight:900;color:var(--blue-d);
  text-shadow:0 2px 0 #fff,0 6px 16px rgba(0,72,192,.22);}
.sub{font-size:clamp(14px,2.6vw,22px);color:var(--brown);margin-top:8px;font-weight:700;}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
.pill{background:rgba(255,255,255,.9);border-radius:24px;padding:6px 18px;
  font-size:clamp(13px,2.2vw,19px);font-weight:800;box-shadow:0 4px 12px rgba(0,72,192,.12);}
.sec{margin:20px 0 8px;}
.sec h2{font-size:clamp(18px,3vw,27px);color:var(--blue-d);margin:16px 4px 10px;
  display:flex;align-items:center;gap:10px;}
.sec h2 .bar{width:10px;height:24px;border-radius:5px;background:linear-gradient(var(--blue),var(--blue-d));display:inline-block;}
.grp{font-size:clamp(15px,2.4vw,21px);color:var(--gold);font-weight:900;margin:12px 4px 8px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;gap:12px;}
a.book{
  text-decoration:none;color:var(--ink);background:rgba(255,255,255,.94);
  border:3px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;
  transition:transform .15s, box-shadow .15s, border-color .15s;display:block;
}
a.book:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 14px 26px rgba(0,72,192,.18);}
a.book:active{transform:scale(.96);}
a.book .bn{font-size:clamp(17px,2.6vw,24px);font-weight:900;color:var(--blue-d);}
a.book .be{font-size:clamp(12px,2vw,16px);color:#8FA3C4;margin-top:3px;font-weight:700;}
a.book .bt{font-size:clamp(13px,2vw,16px);color:var(--brown);margin-top:8px;line-height:1.5;}
a.book.done{border-color:var(--mint);background:linear-gradient(160deg,#F0FAF6,#E4F6EE);}
.hidden{display:none!important;}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px;}
.back{background:rgba(255,255,255,.94);border:3px solid var(--line);color:var(--blue-d);
  font-weight:900;font-size:clamp(15px,2.4vw,21px);border-radius:14px;padding:10px 22px;cursor:pointer;}
.back:hover{border-color:var(--blue);}
.qbook{font-size:clamp(20px,3.2vw,31px);font-weight:900;color:var(--blue-d);}
.qmeta{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.qcard{background:rgba(255,255,255,.96);border-radius:20px;padding:18px 16px;
  box-shadow:0 20px 50px rgba(0,72,192,.15);animation:in .45s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes in{0%{transform:rotateY(80deg) translateZ(-30px);opacity:0}100%{transform:rotateY(0);opacity:1}}
.qtype{display:inline-block;font-size:clamp(13px,2vw,18px);font-weight:900;color:#fff;
  background:var(--blue);padding:5px 16px;border-radius:24px;margin-bottom:10px;}
.qtype.j{background:var(--gold);color:#6B4A00;}
.qtext{font-size:clamp(20px,3.6vw,35px);font-weight:800;line-height:1.7;margin-bottom:16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.opts{grid-template-columns:1fr;}}
.opt{font-size:clamp(16px,2.8vw,26px);background:#F2F6FC;border:3px solid var(--line);border-radius:14px;
  padding:18px 16px;cursor:pointer;font-weight:700;transition:all .15s;min-height:68px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.opt:hover{transform:translateY(-2px);border-color:var(--blue);}
.opt.sel{border-color:var(--blue);background:var(--blue-l);}
.opt.right{border-color:var(--mint);background:#E4F6EE;box-shadow:0 0 0 4px rgba(79,191,143,.35);}
.opt.wrong{border-color:var(--coral);background:#FCE9E9;box-shadow:0 0 0 4px rgba(240,112,112,.35);}
.ans{margin-top:14px;border-radius:14px;padding:14px 18px;font-size:clamp(15px,2.6vw,23px);line-height:1.8;
  animation:in .5s both;}
.ans.good{background:#E9F9F2;border-left:8px solid var(--mint);}
.ans.bad{background:#FDF0EF;border-left:8px solid var(--coral);}
.ans.info{background:#EEF4FF;border-left:8px solid var(--blue);margin-top:8px;}
.ans b{color:var(--blue-d);}
.btns{text-align:center;margin-top:16px;min-height:54px;}
.btn{font-size:clamp(16px,2.8vw,25px);font-weight:900;color:#fff;cursor:pointer;border:none;border-radius:16px;
  padding:18px 36px;background:linear-gradient(180deg,var(--blue),var(--blue-d));
  box-shadow:0 6px 0 var(--blue-d),0 14px 22px rgba(0,72,192,.28);transition:transform .12s,box-shadow .12s;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d);}
.btn.gold{background:linear-gradient(180deg,#FFD66B,var(--gold));color:#6B4A00;box-shadow:0 6px 0 #C78A00,0 14px 22px rgba(242,185,59,.32);}
.btn.gold:active{box-shadow:0 2px 0 #C78A00;}
.pbar{width:100%;height:16px;background:#E4EAFB;border-radius:10px;margin-bottom:14px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:10px;transition:width .3s;}
.fin{text-align:center;padding:24px 10px;animation:in .6s both;}
.fin .fe{font-size:clamp(46px,10vw,96px);animation:bob 2.4s infinite ease-in-out;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.fin h3{font-size:clamp(20px,3.4vw,34px);color:var(--blue-d);margin:12px 0;}
.fin .stars{font-size:clamp(22px,4vw,40px);letter-spacing:5px;}
.card{background:rgba(255,255,255,.96);border-radius:18px;padding:18px 24px;max-width:600px;margin:12px auto;
  text-align:left;font-size:clamp(15px,2.6vw,23px);line-height:2.2;box-shadow:0 14px 34px rgba(0,72,192,.14);}
.card b{color:var(--blue-d);}
.mute{position:fixed;right:14px;top:12px;z-index:9;background:rgba(255,255,255,.9);border:3px solid var(--blue-l);
  border-radius:24px;padding:8px 16px;cursor:pointer;color:var(--blue-d);font-weight:900;font-size:clamp(13px,2vw,17px);}

@media (max-width: 640px) {
  .wrap { padding: 0 4px; }
  .title { font-size: 26px; }
  .sub { font-size: 13px; }
  .pill { font-size: 12px; padding: 4px 10px; }
  .sec h2 { font-size: 17px; }
  .grp { font-size: 14px; }
  .grid { gap: 8px; }
  a.book { padding: 10px 6px; min-height: 85px; }
  a.book .bn { font-size: 15px; }
  a.book .be, a.book .bt { font-size: 11px; }
  .qcard { padding: 14px 12px; }
  .qtext { font-size: 17px; line-height: 1.4; }
  .qtype { font-size: 12px; padding: 3px 10px; }
  .opt { font-size: 16px; padding: 16px 14px; min-height: 58px; border-radius: 12px; }
  .btn { padding: 16px 28px; font-size: 16px; min-height: 52px; }
  .ans { font-size: 14px; padding: 10px 12px; }
  .card { padding: 12px 14px; font-size: 14px; }
  .fin .fe { font-size: 64px; }
  .fin h3 { font-size: 18px; }
  .fin .stars { font-size: 22px; }
  .qbook { font-size: 17px; }
  .qmeta { font-size: 12px; }
  .pbar { height: 10px; }
  .back { padding: 12px 16px; font-size: 14px; min-height: 44px; }
  .mute { right: 6px; top: 6px; padding: 6px 10px; font-size: 12px; min-height: 36px; }
}
html { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

</style>
</head>
<body>
<button class="mute" id="muteBtn" onclick="toggleMute()">🔊 音乐</button>
<div class="wrap">
  <section id="dir">
    <div class="top">
      <a class="home-btn" href="index.html">🏠 返回主页</a>
      <div class="title">📖 隐藏的珍宝知识问答闯关</div>
      <div class="sub">66 卷 · 每卷 50 题 · 内容丰富＋金句填空 · 手机／电脑均可使用</div>
      <div class="stats">
        <span class="pill">📗 旧约 39 卷</span>
        <span class="pill">📕 新约 27 卷</span>
        <span class="pill">🎲 题库随机生成</span>
        <span class="pill" id="doneStat">✅ 已通关 0 / 66</span>
      </div>
    </div>
    <div id="dirBody"></div>
  </section>

  <section id="quiz" class="hidden">
    <div class="qtop">
      <button class="back" onclick="showDir()">← 返回目录</button>
      <button class="back" onclick="reshuffle()">🔄 换一批题目</button>
      <span class="qbook" id="qBook"></span>
      <div class="qmeta">
        <span class="pill">⭐ <b id="score">0</b> 分</span>
        <span class="pill">🔥 连对 <b id="combo">0</b></span>
      </div>
    </div>
    <div id="qArea"></div>
  </section>
</div>

<script>

const ALL_GRPS = ["摩西五经","历史书","诗歌智慧书","大先知书","小先知书","福音书","教会历史","保罗书信","一般书信","启示录"];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniq(a){return [...new Set(a)];}
function sample(a,n){return shuffle(a.slice()).slice(0,n);}
function pickExclude(arr,excl,n){const c=uniq(arr.filter(x=>!excl.includes(x)));return sample(c,n);}

/* ====== 每卷 50 题：10 种题型按比例均衡，同类不连排，无重复 ====== */
function genQuestions(b){
  const E=(b.events||[]).map(x=>{const i=x.indexOf('|');return {w:x.slice(0,i).trim(),e:x.slice(i+1).trim()};});
  const P=b.people||[]; const PL=b.places||[];
  const V=b.verse||'';
  const blanks=[]; {const re=/【([^】]+)】/g;let m;while((m=re.exec(V)))blanks.push({ans:m[1],pos:m.index});}
  const fullVerse=V.replace(/【|】/g,'');
  const ALL_EV=[];
  BIBLE.forEach(bk=>(bk.events||[]).forEach(ev=>{const i=ev.indexOf('|');ALL_EV.push({w:ev.slice(0,i).trim(),e:ev.slice(i+1).trim(),b:bk.name});}));
  const seenEv={};
  const otherEv=ALL_EV.filter(x=>x.b!==b.name).filter(x=>seenEv[x.w+x.e]?false:(seenEv[x.w+x.e]=1));
  const otherEvT=otherEv.map(x=>x.w+x.e);
  const otherPl=uniq(BIBLE.flatMap(x=>x.places||[])).filter(p=>!PL.includes(p));
  const otherAu=uniq(BIBLE.map(x=>x.author)).filter(a=>a!==b.author);
  const otherCh=uniq(BIBLE.map(x=>String(x.ch)).filter(n=>n!==String(b.ch)));
  const otherGrp=ALL_GRPS.filter(g=>g!==b.grp);
  const otherTh=BIBLE.map(x=>x.theme).filter(t=>t!==b.theme);
  const allAns=uniq(BIBLE.flatMap(x=>{const r=[];const re=/【([^】]+)】/g;let m;while((m=re.exec(x.verse||'')))r.push(m[1]);return r;}));
  const qs=[];
  function C(q,ty,opts,correct,why){const o=shuffle(opts.slice());qs.push({t:'c',ty,q,opts:o,a:o.indexOf(correct),why});}
  function J(q,ty,ans,why){qs.push({t:'j',ty,q,opts:[],a:ans?1:0,why});}
  const evT=e=>e.w+e.e;
  const pe=E.filter(ev=>P.includes(ev.w));

  const eqPhr=[`《${b.name}》记载了以下哪一件事？`,`《${b.name}》中有哪一件事？`,`哪一件事出现在《${b.name}》中？`,`关于《${b.name}》的记载，哪一项正确？`,`以下哪件事发生在《${b.name}》里？`,`哪件大事记载在《${b.name}》中？`,`《${b.name}》讲述了哪一件事？`,`以下哪件事出自《${b.name}》？`,`《${b.name}》记载了哪件大事？`,`《${b.name}》里有哪件著名的事？`,`哪件事在《${b.name}》中有记载？`,`《${b.name}》包括哪件事？`,`哪件事属于《${b.name}》的记载？`,`《${b.name}》提到了哪件事？`,`哪件重要的事记在《${b.name}》里？`,`《${b.name}》中讲到哪件事？`];
  const pePhr=[`《${b.name}》中，谁{WHAT}？`,`{WHAT}的人是《${b.name}》中的哪一位？`,`在《${b.name}》里，{WHAT}的是谁？`,`《${b.name}》记载了谁{WHAT}？`,`以下哪一位在《${b.name}》中{WHAT}？`,`《${b.name}》里{WHAT}的是哪一位？`,`谁在《${b.name}》中{WHAT}？`,`{WHAT}这件事发生在《${b.name}》中的谁身上？`,`《${b.name}》里，谁做了{WHAT}？`,`{WHAT}发生在《${b.name}》中的谁身上？`,`《${b.name}》中{WHAT}的主角是谁？`,`{WHAT}的人是《${b.name}》里的谁？`,`在《${b.name}》中{WHAT}的是谁？`,`谁在《${b.name}》里{WHAT}？`];
  const plPhr=[`以下哪个地方出现在《${b.name}》中？`,`《${b.name}》提到了哪个地方？`,`哪个地点与《${b.name}》有关？`,`《${b.name}》中出现了哪个地名？`];
  const auPhr=[`《${b.name}》的传统作者（或主要作者）是谁？`,`一般认为《${b.name}》的作者是谁？`,`《${b.name}》由谁写成（传统）？`];
  const chPhr=[`《${b.name}》共有多少章？`,`《${b.name}》一共有多少章？`,`《${b.name}》全书共几章？`];
  const grpPhr=[`《${b.name}》属于哪一类？`,`《${b.name}》被归在哪一类？`,`《${b.name}》在圣经中属于哪一类？`];
  const tPhr=[`《${b.name}》属于旧约还是新约？`,`《${b.name}》位于旧约还是新约？`,`《${b.name}》属于哪一约？`];
  const thPhr=[`《${b.name}》的中心主题是？`,`《${b.name}》主要讲什么？`,`《${b.name}》的核心信息是？`];

  let ei=0;
  const addEvent=()=>{const ev=E[ei%E.length];C(eqPhr[ei],'event',[evT(ev)].concat(sample(otherEvT,3)),evT(ev),`《${b.name}》记载了「${evT(ev)}」。`);ei++;};
  let pi=0;
  const addPerson=()=>{const ev=pe[pi%pe.length];const op=shuffle(P.slice()).slice(0,4);if(!op.includes(ev.w))op[Math.floor(Math.random()*op.length)]=ev.w;
    C(pePhr[pi].replace('{WHAT}',ev.e),'person',op,ev.w,`${ev.w}${ev.e}（记载在《${b.name}》）。`);pi++;};

  /* ========== 选择题 35（按比例：事件人物略多，其余均衡） ========== */
  let need=35;
  if(P.length>=2){for(let i=0;i<7;i++)addPerson();need-=7;}else{for(let i=0;i<7;i++)addEvent();need-=7;}
  if(PL.length>0){const np=Math.min(PL.length,4);for(let i=0;i<np;i++){C(plPhr[i],'place',[PL[i]].concat(sample(otherPl,3)),PL[i],`${PL[i]}出现在《${b.name}》中。`);}need-=np;}
  auPhr.forEach((ph,i)=>{C(ph,'author',[b.author].concat(sample(otherAu,3)),b.author,`传统上一般认为《${b.name}》的作者是${b.author}。`);need--;});
  chPhr.forEach((ph,i)=>{C(ph,'chapter',[String(b.ch)].concat(sample(otherCh,3)),String(b.ch),`《${b.name}》共有${b.ch}章。`);need--;});
  grpPhr.forEach((ph,i)=>{C(ph,'group',[b.grp].concat(sample(otherGrp,3)),b.grp,`《${b.name}》属于${b.grp}。`);need--;});
  tPhr.forEach((ph,i)=>{C(ph,'testament',['旧约','新约'],b.test==='旧约'?'旧约':'新约',`《${b.name}》属于${b.test}。`);need--;});
  thPhr.forEach((ph,i)=>{C(ph,'theme',[b.theme].concat(sample(otherTh,3)),b.theme,`《${b.name}》的主题：${b.theme}。`);need--;});
  blanks.forEach((bk,i)=>{const shown=V.replace(/【([^】]+)】/g,(m,p,off)=>off===bk.pos?'____':p);
    C(`《${b.name}》金句填空：「${shown}」空格应填什么？`,'fill',[bk.ans].concat(sample(allAns.filter(a=>a!==bk.ans),3)),bk.ans,`完整金句：「${fullVerse}」（《${b.name}》）。`);need--;});
  const chX=[`《${b.name}》有多少章？`,`《${b.name}》的章数是？`,`《${b.name}》共几章？`,`《${b.name}》一共几章？`];
  const grpX=[`《${b.name}》的类别是？`,`《${b.name}》属于哪一类书？`,`《${b.name}》属于哪一类的经卷？`,`《${b.name}》被归入哪一类？`];
  const thX=[`《${b.name}》在讲什么？`,`《${b.name}》最强调什么？`];
  const extras=[];
  chX.forEach(ph=>extras.push(()=>C(ph,'chapter',[String(b.ch)].concat(sample(otherCh,3)),String(b.ch),`《${b.name}》共有${b.ch}章。`)));
  grpX.forEach(ph=>extras.push(()=>C(ph,'group',[b.grp].concat(sample(otherGrp,3)),b.grp,`《${b.name}》属于${b.grp}。`)));
  thX.forEach(ph=>extras.push(()=>C(ph,'theme',[b.theme].concat(sample(otherTh,3)),b.theme,`《${b.name}》的主题：${b.theme}。`)));
  shuffle(extras);
  let xi=0;
  while(need>0){ if(ei<eqPhr.length){addEvent();} else {extras[xi++]();} need--;}

  /* ========== 判断题 15（按比例） ========== */
  J(`《${b.name}》记载了「${evT(E[0])}」。`,'event',true,`是的，《${b.name}》确实记载了这件事。`);
  if(E.length>1)J(`《${b.name}》记载了「${evT(E[1])}」。`,'event',true,`是的，《${b.name}》确实记载了这件事。`);
  else J(`《${b.name}》讲述了「${evT(E[0])}」的故事。`,'event',true,`是的，《${b.name}》确实记载了这件事。`);
  {const fe=sample(otherEv,1)[0];J(`《${b.name}》记载了「${evT(fe)}」。`,'event',false,`「${evT(fe)}」记载在《${fe.b}》，不是《${b.name}》。`);}
  J(`${P[0]}是《${b.name}》中的主要人物。`,'person',true,`${P[0]}确实出现在《${b.name}》中。`);
  if(P.length>1)J(`${P[1]}是《${b.name}》中的主要人物。`,'person',true,`${P[1]}确实出现在《${b.name}》中。`);
  else J(`${P[0]}出现在《${b.name}》的故事中。`,'person',true,`${P[0]}确实出现在《${b.name}》中。`);
  if(P.length>=2){const fp=sample(uniq(BIBLE.flatMap(x=>x.people)).filter(p=>!P.includes(p)),1)[0];
    J(`${fp}是《${b.name}》中的主要人物。`,'person',false,`${fp}不是《${b.name}》中的主要人物。`);}
  else J(`${P[0]}在《${b.name}》里很突出。`,'person',true,`${P[0]}确实出现在《${b.name}》中。`);
  if(PL.length>0){J(`《${b.name}》提到了${PL[0]}。`,'place',true,`${PL[0]}确实出现在《${b.name}》中。`);}
  else{{const fe=sample(otherEv,1)[0];J(`《${b.name}》记载了「${evT(fe)}」。`,'event',false,`「${evT(fe)}」记载在《${fe.b}》，不是《${b.name}》。`);}}
  J(`《${b.name}》的传统作者是${b.author}。`,'author',true,`传统上一般认为《${b.name}》的作者是${b.author}。`);
  J(`《${b.name}》共有${b.ch}章。`,'chapter',true,`《${b.name}》确实共有${b.ch}章。`);
  J(`《${b.name}》共有${sample(otherCh,1)[0]}章。`,'chapter',false,`《${b.name}》实际共有${b.ch}章。`);
  J(`《${b.name}》属于${b.grp}。`,'group',true,`《${b.name}》确实属于${b.grp}。`);
  J(`《${b.name}》属于新约圣经。`,'testament',b.test==='新约',`《${b.name}》属于${b.test}。`);
  J(`《${b.name}》的主题是「${b.theme}」。`,'theme',true,`《${b.name}》的主题：${b.theme}。`);
  if(fullVerse)J(`《${b.name}》中有这句经文：「${fullVerse}」。`,'verse',true,`是的，这是《${b.name}》中的金句。`);
  {const otherVerses=[];BIBLE.forEach(bk=>{const vv=(bk.verse||'').replace(/【|】/g,'').trim();if(vv&&bk.name!==b.name)otherVerses.push({t:vv,b:bk.name});});
   if(otherVerses.length){const ov=sample(otherVerses,1)[0];J(`《${b.name}》中有这句经文：「${ov.t}」。`,'verse',false,`这句经文出自《${ov.b}》，不是《${b.name}》。`);}}

  /* ========== 交错排列：同类不连排 ========== */
  const byTy={};qs.forEach(q=>{(byTy[q.ty]=byTy[q.ty]||[]).push(q);});
  Object.values(byTy).forEach(a=>shuffle(a));
  const out=[];let last=null;
  while(out.length<qs.length){
    let best=null,bestCnt=-1;
    for(const k in byTy){if(byTy[k].length===0||k===last)continue;if(byTy[k].length>bestCnt){best=k;bestCnt=byTy[k].length;}}
    if(best===null){for(const k in byTy){if(byTy[k].length>0){best=k;break;}}}
    out.push(byTy[best].pop());last=best;
  }
  return out.slice(0,50);
}

/* ---------- 目录 ---------- */
function renderDir(){
  const body=document.getElementById('dirBody');
  let html='';
  [['旧约',["摩西五经","历史书","诗歌智慧书","大先知书","小先知书"]],['新约',["福音书","教会历史","保罗书信","一般书信","启示录"]]].forEach(([test,grps])=>{
    html+=`<div class="sec"><h2><span class="bar"></span>${test}（${BIBLE.filter(b=>b.test===test).length}卷）</h2>`;
    grps.forEach(g=>{
      const bs=BIBLE.filter(b=>b.grp===g);
      if(!bs.length) return;
      html+=`<div class="grp">▍${g}</div><div class="grid">`;
      bs.forEach(b=>{
        const i=BIBLE.indexOf(b);
        html+=`<a class="${done[i]?'book done':'book'}" href="#b${i}" onclick="openBook(${i});return false;">
          <div class="bn">${b.name}</div><div class="be">${b.en}</div>
          <div class="bt">${b.ch}章 · ${b.grp}</div></a>`;
      });
      html+='</div>';
    });
    html+='</div>';
  });
  body.innerHTML=html;
  document.getElementById('doneStat').textContent=`✅ 已通关 ${Object.keys(done).length} / 66`;
}
function showDir(){document.getElementById('quiz').classList.add('hidden');document.getElementById('dir').classList.remove('hidden');location.hash='';window.scrollTo(0,0);}
function reshuffle(){ if(cur) openBook(BIBLE.indexOf(cur)); }

/* ---------- 答题 ---------- */
function openBook(i){
  cur=BIBLE[i]; score=0; combo=0; qi=0;
  cur.qs=genQuestions(cur);
  document.getElementById('dir').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('qBook').textContent=`《${cur.name}》${cur.en}`;
  renderQ(); window.scrollTo(0,0);
}
function renderQ(){
  answered=false; picked=null;
  const lv=cur.qs, q=lv[qi];
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  const pct=Math.round(qi/lv.length*100);
  let html=`<div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>`;
  html+=`<div class="qcard">`;
  html+=`<span class="qtype ${q.t==='j'?'j':''}">${q.t==='c'?'选择题':'判断题'} · 第${qi+1}/${lv.length}题</span>`;
  html+=`<div class="qtext">${q.q}</div><div class="opts">`;
  if(q.t==='c'){ q.opts.forEach((op,i)=>{html+=`<div class="opt" onclick="pick(${i},this)">${'ABCD'[i]}．${op}</div>`;}); }
  else { html+=`<div class="opt" onclick="pick(0,this)">✔ 对</div><div class="opt" onclick="pick(1,this)">✘ 错</div>`; }
  html+=`</div><div id="ans"></div></div><div class="btns">`;
  html+=`<button class="btn" id="btnAns" onclick="showAnswer()">🔍 显示答案</button>`;
  html+=`<button class="btn gold hidden" id="btnNext" onclick="nextQ()">下一题 ➜</button>`;
  html+=`</div>`;
  document.getElementById('qArea').innerHTML=html;
}
function pick(i,el){ if(answered) return; picked=i; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
function showAnswer(){
  if(answered) return;
  answered=true;
  const q=cur.qs[qi];
  const correct=q.t==='c'?q.a:(q.a===1?0:1);
  const right=picked===null?null:(picked===correct);
  document.querySelectorAll('.opt').forEach((o,idx)=>{
    if(idx===correct)o.classList.add('right');
    if(picked!==null&&idx===picked&&picked!==correct)o.classList.add('wrong');
  });
  let html='';
  if(right===true){score+=10+combo*2;combo++;sfxRight();speakFeedback('答对了，太棒了！');
    html=`<div class="ans good"><b>✅ 答对了！+${10+(combo-1)*2}分</b></div>`;
  }else if(right===false){combo=0;sfxWrong();speakFeedback('继续加油，再想想！');
    html=`<div class="ans bad"><b>❌ 答错了</b> · 正确答案：${ansText(q)}</div>`;
  }else{html=`<div class="ans info"><b>🔍 答案：</b>${ansText(q)}</div>`;}
  html+=`<div class="ans info">💡 ${q.why}</div>`;
  document.getElementById('ans').innerHTML=html;
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('btnAns').classList.add('hidden');
  document.getElementById('btnNext').classList.remove('hidden');
  document.getElementById('btnNext').textContent=(qi+1<cur.qs.length)?'下一题 ➜':'本卷完成 🎉';
}
function ansText(q){ if(q.t==='c')return 'ABCD'[q.a]+'．'+q.opts[q.a]; return q.a===1?'✔ 对':'✘ 错'; }
function nextQ(){ if(qi+1<cur.qs.length){qi++;renderQ();} else {finishBook();} }
function finishBook(){
  const i=BIBLE.indexOf(cur);
  done[i]=1; localStorage.setItem('bibleQuizDone',JSON.stringify(done));
  renderDir();
  const s=score;
  const stars=s>=420?'⭐⭐⭐':s>=300?'⭐⭐':'⭐';
  const grade=s>=420?'🏆 太棒了！':s>=300?'👍 很好，继续加油！':'💪 再读一遍这一卷吧！';
  document.getElementById('qArea').innerHTML=`
    <div class="fin">
      <div class="fe">🏆</div>
      <h3>《${cur.name}》通关！</h3>
      <div class="stars">${stars}</div>
      <div style="font-size:clamp(15px,2.6vw,24px);font-weight:900;color:var(--blue-d);margin:10px 0">本卷得分：${s} / 500</div>
      <div class="card">
        <b>《${cur.name}》小档案</b><br>
        📚 类别：${cur.grp}（${cur.test}）<br>
        ✍️ 传统作者：${cur.author}<br>
        📖 章数：${cur.ch} 章<br>
        💡 主题：${cur.theme}
      </div>
      <div class="btns" style="margin-top:16px">
        <button class="btn gold" onclick="openBook(Math.floor(Math.random()*${BIBLE.length}))">🎲 随机再测一卷</button>
        <button class="btn" onclick="showDir()">📚 返回目录</button>
      </div>
    </div>`;
  sfxLevel();
}

/* ---------- 音乐 ---------- */
let AC=null,master=null,musicOn=true,timer=null;
function ensureAudio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.14;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}
function note(f,d,t,type,v,dst){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.06);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(dst||master);o.start(t);o.stop(t+d+0.05);}
function tone(f,d,delay,vol){ensureAudio();note(f,d,AC.currentTime+delay,'sine',vol||.5);}
function sfxRight(){tone(660,.12,0);setTimeout(()=>tone(880,.18,0),110);}
function sfxWrong(){tone(220,.28,0,.3);setTimeout(()=>tone(170,.32,0,.3),120);}
function sfxLevel(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,0,.35),i*130));}
function speakFeedback(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=1.05; u.volume=1;
    const vs=window.speechSynthesis.getVoices();
    const v=vs.find(x=>/zh/i.test(x.lang)&&/xiaoxiao|tingting|meijia|huihui|female/i.test(x.name))||vs.find(x=>/zh/i.test(x.lang));
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
const CH=[[261.6,329.6,392],[196,246.9,293.7],[220,261.6,329.6],[174.6,220,261.6]];
function loop(){ensureAudio();const t0=AC.currentTime+.05;CH.forEach((ch,c)=>{ch.forEach((f,k)=>note(f,2.4,t0+c*2.2+k*.02,'sine',.09));[0,1,2,1].forEach((s,i)=>note(ch[s],.5,t0+c*2.2+i*.28,'triangle',.05));});timer=setTimeout(loop,4*2.2*1000);}
function toggleMute(){ensureAudio();musicOn=!musicOn;document.getElementById('muteBtn').textContent=musicOn?'🔊 音乐':'🔇 静音';if(master)master.gain.value=musicOn?.14:0;if(musicOn&&!timer)loop();}

renderDir();
</script>
